services:
  alohssh:
    image: alohssh:latest
    container_name: alohssh
    env_file:
      - .env
    ports:
      - ${SERVER_PORT}:2222
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - aloh-ssh-network
    stop_grace_period: 5s

  postgres:
    image: postgres:latest
    volumes:
      - pg_data:/var/lib/postgresql
    env_file:
      - .env
    ports:
      - ${POSTGRES_PORT}:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    networks:
      - aloh-ssh-network
    stop_grace_period: 5s

  migrate:
    build: ./
    env_file:
      - .env
    volumes:
      - ./internal/migrations:/migrations
    entrypoint: ["goose", "-dir", "/migrations"]
    command: ["postgres", "$$GOOSE_DBSTRING", "up"]
    networks:
      - aloh-ssh-network
  
networks:
  aloh-ssh-network:
    driver: bridge
    external: false

volumes:
  pg_data: