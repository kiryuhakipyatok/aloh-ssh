stages:
  - build
  - test
  - migrate
  - deploy

build-job:
  stage: build
  script:
    - docker build -t alohssh .

test-job:
  stage: test
  script:
    - echo "testing..."
    - sleep 10s

migrate-job:
  stage: migrate
  script:
    - docker compose run --rm migrate up

deploy-job:
  stage: deploy 
  script:
    - cp $ENV_FILE .env
    - docker-compose down --remove-orphans
    - docker-compose up -d --build
    - sleep 5
    - docker-compose logs alohssh
